[defaults]

# default invertory file
inventory = inventory.yml

# automatically find the python interpreter and go
interpreter_python = auto_silent

# Disables host key checking to prevent interactive prompts on new nodes
host_key_checking = False

[ssh_connection]
# ControlMaster=auto: the first connection to a host becomes the “master.” Improve ssh performance
# by reusing open sockets (if available)
#
# ControlPersist=60s: keep connection open for 60s after last task
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

# Streams modules straight to the remote Python instead of copying temp files first (fewer SSH round trips per task)
pipelining = True
